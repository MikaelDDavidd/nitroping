# NitroPing — deploy stack pro Dokploy (oddnow).
#
# Sobe um stack autocontido com Postgres + Redis + NitroPing server.
# Postgres e Redis ficam internos ao stack (não expostos pra fora) pra
# minimizar superfície de ataque. Só a porta 3412 do server fica pra
# o Traefik do Dokploy fazer reverse proxy via subdomínio.
#
# Variáveis de ambiente: criar via UI do Dokploy ou .env ao lado.
# Secrets já gerados (rotacionar se este arquivo vazar):
#   POSTGRES_PASSWORD=<setado via Dokploy>
#   JWT_SECRET=<setado via Dokploy — 64 bytes hex>
#   WEBHOOK_SECRET=<setado via Dokploy — 32 bytes hex>
#   ENCRYPTION_KEY=<setado via Dokploy — 32 bytes hex>

services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: nitroping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nitroping
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nitroping -d nitroping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.0.6-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  server:
    image: ghcr.io/mikaelddavidd/nitroping:latest
    restart: always
    environment:
      # Database
      DATABASE_URL: postgres://nitroping:${POSTGRES_PASSWORD}@db:5432/nitroping

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Server
      NITRO_HOST: 0.0.0.0
      PORT: 3412

      # Secrets (configurar no Dokploy → Environment)
      JWT_SECRET: ${JWT_SECRET}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Rate limiting (production-friendly defaults)
      RATE_LIMIT_DEFAULT: 1000
      RATE_LIMIT_WINDOW: 3600
      RATE_LIMIT_DISABLED: false

      # Features
      SCHEDULER_ENABLED: true
    ports:
      - '3412:3412'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
